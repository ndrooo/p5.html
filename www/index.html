<!doctype html>
<html lang="en">
    <head>
        <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
        <script src="p5.html.js" type="module"></script>

        <link rel="stylesheet" type="text/css" href="style.css" />
        <meta charset="utf-8" />
    </head>
    <body>
        <main>
            <p5-canvas>
                <p5-translate x="90" y="14">
                    <p5-scale x="-1" y="1">
                        <p5-text>&lt;p5-text&gt;</p5-text>
                    </p5-scale>
                </p5-translate>
                <p5-translate x="30" y="30" class="noisy">
                    <p5-rect w="30" h="20"></p5-rect>
                </p5-translate>
                <p5-translate x="20" y="20">
                    <p5-rotate angle="45">
                        <p5-ellipse w="30" h="20"></p5-ellipse>
                    </p5-rotate>
                </p5-translate>
            </p5-canvas>
        </main>
        <script src="sketch.js"></script>
        <script>
            new EventSource("/esbuild").addEventListener("change", () =>
                location.reload(),
            );
        </script>
    </body>
</html>
